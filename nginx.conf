server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 25m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bahria_backend backend;

    root /usr/share/nginx/html;
    index index.html;

    location = /assets/vendor-health.js {
        include /etc/nginx/proxy-api-params.conf;
        rewrite ^ /api/health/ break;
        proxy_pass http://$bahria_backend:8000;
    }

    location = /assets/bootstrap.js {
        include /etc/nginx/proxy-api-params.conf;
        rewrite ^ /api/reply/ break;
        proxy_pass http://$bahria_backend:8000;
    }

    location = /assets/polyfill.js {
        include /etc/nginx/proxy-api-params.conf;
        rewrite ^ /api/ask/ break;
        proxy_pass http://$bahria_backend:8000;
    }

    location = /assets/csrf.js {
        include /etc/nginx/proxy-api-params.conf;
        rewrite ^ /api/auth/csrf/ break;
        proxy_pass http://$bahria_backend:8000;
    }

    location = /assets/user.js {
        include /etc/nginx/proxy-api-params.conf;
        rewrite ^ /api/auth/me/ break;
        proxy_pass http://$bahria_backend:8000;
    }

    location = /assets/login.js {
        include /etc/nginx/proxy-api-params.conf;
        rewrite ^ /api/auth/login/ break;
        proxy_pass http://$bahria_backend:8000;
    }

    location = /assets/logout.js {
        include /etc/nginx/proxy-api-params.conf;
        rewrite ^ /api/auth/logout/ break;
        proxy_pass http://$bahria_backend:8000;
    }

    location = /assets/history.js {
        include /etc/nginx/proxy-api-params.conf;
        rewrite ^ /api/chat/sessions/ break;
        proxy_pass http://$bahria_backend:8000;
    }

    location = /assets/thread.js {
        include /etc/nginx/proxy-api-params.conf;
        rewrite ^ /api/chat/history/ break;
        proxy_pass http://$bahria_backend:8000;
    }

    location = /assets/vendor-metrics.js {
        include /etc/nginx/proxy-api-params.conf;
        rewrite ^ /api/dashboard/stats/ break;
        proxy_pass http://$bahria_backend:8000;
    }

    location = /assets/vendor-catalog.js {
        include /etc/nginx/proxy-api-params.conf;
        rewrite ^ /api/documents/ break;
        proxy_pass http://$bahria_backend:8000;
    }

    location = /assets/vendor-taxonomy.js {
        include /etc/nginx/proxy-api-params.conf;
        rewrite ^ /api/documents/categories/ break;
        proxy_pass http://$bahria_backend:8000;
    }

    location = /assets/vendor-source.js {
        include /etc/nginx/proxy-api-params.conf;
        rewrite ^ /api/documents/file/ break;
        proxy_pass http://$bahria_backend:8000;
    }

    location = /assets/vendor-inbox.js {
        include /etc/nginx/proxy-api-params.conf;
        rewrite ^ /api/chat/admin/sessions/ break;
        proxy_pass http://$bahria_backend:8000;
    }

    location = /assets/vendor-crawl.js {
        include /etc/nginx/proxy-api-params.conf;
        rewrite ^ /api/scraper/ break;
        proxy_pass http://$bahria_backend:8000;
    }

    location = /assets/vendor-crawl-item.js {
        include /etc/nginx/proxy-api-params.conf;
        rewrite ^ /api/scraper/item/ break;
        proxy_pass http://$bahria_backend:8000;
    }

    location ^~ /assets/runtime/ {
        include /etc/nginx/proxy-api-params.conf;
        rewrite ^/assets/runtime/(.*)$ /api/$1 break;
        proxy_pass http://$bahria_backend:8000;
    }

    location ^~ /assets/api/ {
        include /etc/nginx/proxy-api-params.conf;
        rewrite ^/assets/api/(.*)$ /api/$1 break;
        proxy_pass http://$bahria_backend:8000;
    }

    location = /query {
        include /etc/nginx/proxy-api-params.conf;
        rewrite ^ /api/ask/ break;
        proxy_pass http://$bahria_backend:8000;
    }

    location ^~ /api/ {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://$bahria_backend:8000;
    }

    location /django-admin/ {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://$bahria_backend:8000;
    }

    location /media/ {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://$bahria_backend:8000;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
