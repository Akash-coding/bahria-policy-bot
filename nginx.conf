server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    location = /assets/vendor-health.js {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000/api/health/;
    }

    location = /assets/bootstrap.js {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000/api/reply/;
    }

    location = /assets/polyfill.js {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000/api/ask/;
    }

    location = /assets/csrf.js {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000/api/auth/csrf/;
    }

    location = /assets/user.js {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000/api/auth/me/;
    }

    location = /assets/login.js {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000/api/auth/login/;
    }

    location = /assets/logout.js {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000/api/auth/logout/;
    }

    location = /assets/history.js {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000/api/chat/sessions/;
    }

    location = /assets/thread.js {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000/api/chat/history/;
    }

    location = /assets/vendor-metrics.js {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000/api/dashboard/stats/;
    }

    location = /assets/vendor-catalog.js {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000/api/documents/;
    }

    location = /assets/vendor-taxonomy.js {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000/api/documents/categories/;
    }

    location = /assets/vendor-source.js {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000/api/documents/file/;
    }

    location = /assets/vendor-inbox.js {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000/api/chat/admin/sessions/;
    }

    location = /assets/vendor-crawl.js {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000/api/scraper/;
    }

    location = /assets/vendor-crawl-item.js {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000/api/scraper/item/;
    }

    location ^~ /assets/runtime/ {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000/api/;
    }

    location ^~ /assets/api/ {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000/api/;
    }

    location = /query {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000/api/ask/;
    }

    location ^~ /api/ {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000;
    }

    location /django-admin/ {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000;
    }

    location /media/ {
        include /etc/nginx/proxy-api-params.conf;
        proxy_pass http://backend:8000;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
