services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bahria_policy_bot}
      POSTGRES_USER: ${POSTGRES_USER:-bahria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bahria} -d ${POSTGRES_DB:-bahria_policy_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_ENGINE: postgres
      POSTGRES_HOST: db
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,10.1.2.216
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1,http://10.1.2.216
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://10.1.2.216
      DJANGO_COOKIE_SECURE: "false"
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      GROQ_TEMPERATURE: "0.4"
      GROQ_MAX_TOKENS: "800"
      EMBEDDING_PROVIDER: sentence-transformers
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      HF_HUB_DISABLE_XET: "1"
      MEDIA_ROOT: /srv/data/documents
      VECTOR_DB_PATH: /srv/data/chroma
    volumes:
      - app_data:/srv/data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        FRONTEND_BUILD: "20260929b"
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  app_data:
