services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bahria_policy_bot}
      POSTGRES_USER: ${POSTGRES_USER:-bahria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bahria} -d ${POSTGRES_DB:-bahria_policy_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 15s

  ollama-pull:
    image: curlimages/curl:8.12.1
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./docker/pull-models.sh:/pull-models.sh:ro
    user: "0"
    entrypoint: ["/bin/sh", "/pull-models.sh"]
    restart: on-failure

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_ENGINE: postgres
      POSTGRES_HOST: db
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,10.1.2.216
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1,http://10.1.2.216,http://10.1.2.216:8000
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://10.1.2.216,http://10.1.2.216:8000
      DJANGO_COOKIE_SECURE: "false"
      OLLAMA_BASE_URL: http://ollama:11434
      MEDIA_ROOT: /srv/data/documents
      VECTOR_DB_PATH: /srv/data/chroma
    volumes:
      - app_data:/srv/data
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  app_data:
  ollama_data:
